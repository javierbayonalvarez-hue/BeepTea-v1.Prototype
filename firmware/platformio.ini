[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
  --no-stub
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  bodmer/TFT_eSPI@^2.5.43
  bodmer/TJpg_Decoder@^1.1.0
  ESP32Async/ESPAsyncWebServer@^3.7.10
  ESP32Async/AsyncTCP@^3.4.7
  adafruit/RTClib@^2.1.4
  h2zero/NimBLE-Arduino@^1.4.2
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D INIT_SEQUENCE_3=1
  -D TFT_INVERSION_ON=1
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_PARALLEL_8_BIT=1
  -D TFT_WIDTH=170
  -D TFT_HEIGHT=320
  -D TFT_CS=6
  -D TFT_DC=7
  -D TFT_RST=5
  -D TFT_WR=8
  -D TFT_RD=9
  -D TFT_D0=39
  -D TFT_D1=40
  -D TFT_D2=41
  -D TFT_D3=42
  -D TFT_D4=45
  -D TFT_D5=46
  -D TFT_D6=47
  -D TFT_D7=48
  -D TFT_BL=38
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D CGRAM_OFFSET=1

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  bodmer/TFT_eSPI@^2.5.43
  bodmer/TJpg_Decoder@^1.1.0
  ESP32Async/ESPAsyncWebServer@^3.7.10
  ESP32Async/AsyncTCP@^3.4.7
  adafruit/RTClib@^2.1.4
  h2zero/NimBLE-Arduino@^1.4.2
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=9
  -D TFT_SCLK=7
  -D TFT_CS=-1
  -D TFT_DC=3
  -D TFT_RST=-1
  -D TFT_BL=8
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1

